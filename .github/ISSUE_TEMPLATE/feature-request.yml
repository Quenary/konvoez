name: 💡 Feature Request
description: Suggest a new idea or improvement
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make this project better?
        Share it here — the clearer, the better!

  - type: input
    id: summary
    attributes:
      label: What’s the feature?
      description: Short one-liner describing the feature
      placeholder: Push-to-talk in the desktop client
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why is it useful?
      description: What problem does this solve, or how would it improve things?
      placeholder: Helps in noisy rooms without muting and unmuting by hand.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Any extra thoughts?
      description: How you imagine it working, or links to similar things.
      placeholder: Optional sketches, examples, or UX notes.
    validations:
      required: false
