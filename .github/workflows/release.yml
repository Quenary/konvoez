name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Force bump: patch | minor | major | x.y.z (empty = conventional commits)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog, tag, GitHub release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Force branch to workflow sha
        run: git reset --hard ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          MEDIASOUP_WORKER_BIN: /bin/true
        run: npm ci

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          SPECIFIER: ${{ github.event.inputs.specifier }}
        run: node tools/release.mjs --specifier "$SPECIFIER"

  image:
    name: Build and push prod image
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/prod-image.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
