name: Run Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          MEDIASOUP_WORKER_BIN: /bin/true
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Run tests
        run: npx nx run frontend:test

      - name: Run lint
        if: always()
        run: npx nx run frontend:eslint:lint

      - name: Run Prettier Check
        if: always()
        run: npx nx run frontend:format:check

      - name: Run root Prettier Check
        if: always()
        run: |
          printf '%s\n' 'apps' 'libs' > "${RUNNER_TEMP:-/tmp}/prettier-root-ignore"
          npx prettier --check . \
            --ignore-path .gitignore \
            --ignore-path .prettierignore \
            --ignore-path "${RUNNER_TEMP:-/tmp}/prettier-root-ignore"

      - name: Run build
        if: always()
        run: npx nx run frontend:build:production

  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          MEDIASOUP_WORKER_BIN: /bin/true
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        env:
          KONVOEZ_REQUIRE_FFMPEG: '1'
        run: npx nx run backend:test

      - name: Run lint
        if: always()
        run: npx nx run backend:eslint:lint

      - name: Run shared library lint
        if: always()
        run: npx nx run shared:eslint:lint

      - name: Run Prettier Check
        if: always()
        run: npx nx run backend:format:check

      - name: Run shared library Prettier Check
        if: always()
        run: npx nx run shared:format:check

      - name: Run build
        if: always()
        run: npx nx run backend:build:production

  desktop-tests:
    name: Run Desktop Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: rustup toolchain install

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libclang-dev libpipewire-0.3-dev

      - name: Install dependencies
        env:
          MEDIASOUP_WORKER_BIN: /bin/true
        run: npm ci

      - name: Run tests
        run: npx nx run-many -t test -p desktop desktop-native desktop-ui client-shell

      - name: Run lint
        if: always()
        run: |
          npx nx run-many -t eslint:lint -p desktop desktop-ui client-shell
          npx nx run desktop-native:lint

      - name: Run Prettier Check
        if: always()
        run: npx nx run-many -t format:check -p desktop desktop-native desktop-ui client-shell

      - name: Run build
        if: always()
        run: npx nx run desktop:build

  desktop-native-windows:
    name: Clippy desktop-native (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install

      - name: Clippy
        working-directory: libs/desktop-native
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings
