<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Share your screen</title>
    <link
      rel="stylesheet"
      href="host.css" />
    <link
      rel="stylesheet"
      href="pages.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="title">Share your screen</h1>

      <div class="tabs">
        <button
          type="button"
          class="tab-btn active"
          id="tab-screens"
          >Screens</button
        >
        <button
          type="button"
          class="tab-btn"
          id="tab-windows"
          >Windows</button
        >
      </div>

      <div
        class="sources-grid"
        id="sources-grid"></div>

      <div class="picker-footer">
        <div class="picker-audio-option">
          <label
            class="checkbox-group"
            id="audio-checkbox-group">
            <input
              type="checkbox"
              id="audio-checkbox"
              checked />
            <span id="audio-checkbox-label">Share system audio</span>
          </label>
          <span
            class="picker-audio-hint"
            id="audio-hint"
            >Broadcasts all system audio, including other participants (may
            cause echo)</span
          >
        </div>

        <div class="buttons">
          <button
            type="button"
            class="secondary"
            id="cancel-btn"
            >Cancel</button
          >
          <button
            type="button"
            class="primary"
            id="share-btn"
            disabled
            >Share</button
          >
        </div>
      </div>
    </div>
    <script src="picker.js"></script>
  </body>
</html>
