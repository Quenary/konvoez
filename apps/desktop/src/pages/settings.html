<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Settings - Konvoez</title>
    <link
      rel="stylesheet"
      href="pages.css" />
  </head>
  <body>
    <div class="container settings-page">
      <div class="settings-scroll">
        <div class="settings-stack">
          <h1 id="title">Desktop Settings</h1>

          <p
            class="settings-subtitle"
            id="lbl-hotkeys">
            Global Hotkeys
          </p>

          <div class="hotkey-block">
            <label
              id="lbl-toggle-mic"
              for="mic-hotkey-input"
              >Toggle microphone</label
            >
            <input
              type="text"
              id="mic-hotkey-input"
              class="hotkey-input"
              readonly
              placeholder="" />
            <div
              class="status-message"
              id="mic-status"></div>
          </div>

          <div class="hotkey-block">
            <label
              id="lbl-toggle-speaker"
              for="speaker-hotkey-input"
              >Toggle speaker / deafen</label
            >
            <input
              type="text"
              id="speaker-hotkey-input"
              class="hotkey-input"
              readonly
              placeholder="" />
            <div
              class="status-message"
              id="speaker-status"></div>
          </div>

          <label
            class="checkbox-group"
            for="autostart-checkbox">
            <input
              type="checkbox"
              id="autostart-checkbox" />
            <span id="lbl-autostart">Start on system boot</span>
          </label>
        </div>
      </div>

      <div class="settings-footer">
        <div
          class="status-message"
          id="settings-status"></div>

        <div class="buttons">
          <button
            type="button"
            class="primary"
            id="save-btn"
            >Save</button
          >
        </div>
      </div>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
