<tui-root>
  <tui-pull-to-refresh
    appPullToRefresh
    [styleHandler]="pullShift"
    (pulled)="reloadPage()">
    @if (isAuthenticated()) {
      @if (isMobile()) {
        <div class="mobile-layout">
          <main class="mobile-main">
            <div class="mobile-content">
              <router-outlet></router-outlet>
            </div>
          </main>
          <app-mobile-tab-bar />
        </div>
      } @else {
        <div class="desktop-layout">
          <aside [tuiNavigationAside]="!collapsed()">
            <header>
              <button
                tuiAsideItem
                [iconStart]="icons.home"
                type="button"
                [routerLink]="'/'"
                [routerLinkActiveOptions]="{ exact: true }">
                @if (!collapsed()) {
                  <app-logo></app-logo>
                }
              </button>
            </header>

            @defer {
              <app-room-aside-list
                [collapsed]="collapsed()"></app-room-aside-list>
            }

            <footer>
              @defer {
                <app-call-controls-aside
                  [collapsed]="collapsed()"></app-call-controls-aside>
              }

              @defer {
                <app-settings-aside-list></app-settings-aside-list>
              }

              @if (versionInfo.value(); as v) {
                @if (v.currentVersion) {
                  <button
                    tuiAsideItem
                    type="button"
                    [iconStart]="icons.info">
                    {{ v.currentVersion }}
                  </button>
                }
                @if (v.updateAvailable && v.releaseUrl && canManageSettings()) {
                  <a
                    tuiAsideItem
                    [href]="v.releaseUrl"
                    target="_blank"
                    rel="noopener noreferrer"
                    [iconStart]="icons.download"
                    [style.color]="'var(--tui-text-positive)'">
                    {{ 'MENU.UPDATE_AVAILABLE' | translate }}
                  </a>
                }
              }

              <button
                tuiAsideItem
                type="button"
                [iconStart]="
                  collapsed() ? icons['chevron-right'] : icons['chevron-left']
                "
                (click)="collapsed.update((v) => !v)">
                {{
                  (collapsed() ? 'MENU.EXPAND' : 'MENU.COLLAPSE') | translate
                }}
              </button>
            </footer>
          </aside>

          <main tuiNavigationMain>
            <router-outlet></router-outlet>
          </main>
        </div>
      }
    } @else {
      <router-outlet></router-outlet>
    }
    <app-connection-state-notification />
    <app-voice-connection-notification />
    <app-pending-call-dialog />
    <app-pwa-update-notification />
  </tui-pull-to-refresh>
</tui-root>
