<form
  appearance="floating"
  tuiCardLarge
  tuiForm="m"
  [formGroup]="form"
  (submit)="onSubmit()">
  <header tuiHeader>
    <button
      appearance="flat"
      tuiButton
      type="button"
      routerLink="/auth">
      <tui-icon icon="@tui.chevron-left" />
      {{ 'GENERAL.GO_BACK' | translate }}
    </button>
  </header>

  <tui-textfield iconStart="@tui.user">
    <label
      tuiLabel
      for="register-username">
      {{ 'AUTH.USERNAME' | translate }}
    </label>

    <input
      tuiInput
      id="register-username"
      autocomplete="username"
      formControlName="username"
      type="text" />
  </tui-textfield>

  <tui-textfield iconStart="@tui.lock">
    <label
      tuiLabel
      for="register-password">
      {{ 'AUTH.PASSWORD' | translate }}
    </label>

    <input
      tuiInput
      id="register-password"
      autocomplete="new-password"
      formControlName="password"
      type="password" />

    <tui-icon
      icon="@tui.message-circle-question-mark"
      [tuiTooltip]="'AUTH.PASSWORD_HINT' | translate"></tui-icon>

    <tui-icon tuiPassword />
  </tui-textfield>

  <tui-textfield iconStart="@tui.lock">
    <label
      tuiLabel
      for="confirm-register-password">
      {{ 'AUTH.CONFIRM_PASSWORD' | translate }}
    </label>
    <input
      tuiInput
      id="confirm-register-password"
      autocomplete="new-password"
      formControlName="confirmPassword"
      type="password" />

    <tui-icon
      icon="@tui.message-circle-question-mark"
      [tuiTooltip]="'AUTH.PASSWORD_HINT' | translate"></tui-icon>

    <tui-icon tuiPassword />
  </tui-textfield>

  <tui-textfield iconStart="@tui.file-user">
    <label
      tuiLabel
      for="register-fullname">
      {{ 'AUTH.FULLNAME' | translate }}
    </label>

    <input
      tuiInput
      id="register-fullname"
      autocomplete="name"
      formControlName="fullname"
      type="text" />
  </tui-textfield>

  <tui-textfield iconStart="@tui.mail">
    <label
      tuiLabel
      for="register-email">
      {{ 'AUTH.EMAIL' | translate }}
    </label>

    <input
      tuiInput
      id="register-email"
      autocomplete="email"
      formControlName="email"
      type="text" />
  </tui-textfield>

  <footer>
    <button
      tuiButton
      type="submit"
      [disabled]="!form.dirty"
      [loading]="loading()">
      <tui-icon icon="@tui.user-plus" />
      {{ 'GENERAL.SAVE' | translate }}
    </button>
  </footer>
</form>
