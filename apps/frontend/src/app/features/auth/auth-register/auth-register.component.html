<form
  appearance="floating"
  tuiCardLarge
  tuiForm="m"
  novalidate
  [formGroup]="form"
  (ngSubmit)="onSubmit()">
  <header tuiHeader>
    <button
      appearance="flat"
      tuiButton
      type="button"
      routerLink="/auth">
      <tui-icon icon="@tui.chevron-left" />
      {{ 'GENERAL.GO_BACK' | translate }}
    </button>
  </header>

  <tui-textfield iconStart="@tui.user">
    <label
      tuiLabel
      for="register-username">
      {{ 'PROFILE.USERNAME' | translate }}
    </label>

    <input
      tuiInput
      id="register-username"
      autocomplete="username"
      formControlName="username"
      type="text" />
  </tui-textfield>
  @if (errors().username; as err) {
    <tui-error [error]="err | translate" />
  }

  <tui-textfield iconStart="@tui.lock">
    <label
      tuiLabel
      for="register-password">
      {{ 'PROFILE.PASSWORD' | translate }}
    </label>

    <input
      tuiInput
      id="register-password"
      autocomplete="new-password"
      formControlName="password"
      type="password" />

    <tui-icon
      icon="@tui.message-circle-question-mark"
      [tuiTooltip]="'PROFILE.PASSWORD_HINT' | translate"></tui-icon>

    <tui-icon tuiPassword />
  </tui-textfield>
  @if (errors().password; as err) {
    <tui-error [error]="err | translate" />
  }

  <tui-textfield iconStart="@tui.lock">
    <label
      tuiLabel
      for="confirm-register-password">
      {{ 'PROFILE.CONFIRM_PASSWORD' | translate }}
    </label>
    <input
      tuiInput
      id="confirm-register-password"
      autocomplete="new-password"
      formControlName="confirmPassword"
      type="password" />

    <tui-icon
      icon="@tui.message-circle-question-mark"
      [tuiTooltip]="'PROFILE.PASSWORD_HINT' | translate"></tui-icon>

    <tui-icon tuiPassword />
  </tui-textfield>
  @if (errors().confirmPassword; as err) {
    <tui-error [error]="err | translate" />
  }

  <tui-textfield iconStart="@tui.file-user">
    <label
      tuiLabel
      for="register-fullname">
      {{ 'PROFILE.FULLNAME' | translate }}
    </label>

    <input
      tuiInput
      id="register-fullname"
      autocomplete="name"
      formControlName="fullname"
      type="text" />
  </tui-textfield>
  @if (errors().fullname; as err) {
    <tui-error [error]="err | translate" />
  }

  <tui-textfield iconStart="@tui.mail">
    <label
      tuiLabel
      for="register-email">
      {{ 'PROFILE.EMAIL' | translate }}
    </label>

    <input
      tuiInput
      id="register-email"
      autocomplete="email"
      formControlName="email"
      type="text" />
  </tui-textfield>
  @if (errors().email; as err) {
    <tui-error [error]="err | translate" />
  }

  <footer>
    <button
      tuiButton
      type="submit"
      [disabled]="!form.dirty"
      [loading]="loading()">
      <tui-icon icon="@tui.user-plus" />
      {{ 'GENERAL.SIGN_UP' | translate }}
    </button>
  </footer>
</form>
