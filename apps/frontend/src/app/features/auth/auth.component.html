<form
  appearance="floating"
  tuiCardLarge
  tuiForm="m"
  [formGroup]="form"
  (submit)="onSubmit()">
  <header tuiHeader>
    <h2 tuiTitle>
      {{ 'GENERAL.HELLO' | translate }}
    </h2>
  </header>

  <tui-textfield iconStart="@tui.user">
    <label
      tuiLabel
      for="username">
      {{ 'AUTH.USERNAME' | translate }}
    </label>

    <input
      tuiInput
      id="username"
      autocomplete="username"
      formControlName="username"
      type="text" />
  </tui-textfield>

  <tui-textfield iconStart="@tui.lock">
    <label
      tuiLabel
      for="password">
      {{ 'AUTH.PASSWORD' | translate }}
    </label>

    <input
      tuiInput
      id="password"
      autocomplete="current-password"
      formControlName="password"
      type="password" />

    <tui-icon tuiPassword />
  </tui-textfield>

  <footer>
    <button
      tuiButton
      type="submit"
      [disabled]="!form.dirty"
      [loading]="loading()">
      <tui-icon icon="@tui.log-in" />
      {{ 'AUTH.SIGN_IN' | translate }}
    </button>

    <button
      appearance="flat"
      tuiButton
      type="button"
      routerLink="/auth/register">
      <tui-icon icon="@tui.user-plus" />
      {{ 'AUTH.SIGN_UP' | translate }}
    </button>
  </footer>
</form>
