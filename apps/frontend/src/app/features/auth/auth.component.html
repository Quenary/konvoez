<form
  appearance="floating"
  tuiCardLarge
  tuiForm="m"
  [formGroup]="form"
  (submit)="onSubmit()">
  <header tuiHeader>
    <h2 tuiTitle>
      {{ 'GENERAL.HELLO' | translate }}
    </h2>
  </header>

  <tui-textfield iconStart="@tui.user">
    <label
      tuiLabel
      for="username">
      {{ 'AUTH.USERNAME' | translate }}
    </label>
    <input
      tuiInput
      id="username"
      autocomplete="username"
      formControlName="username"
      type="text"
      [placeholder]="'AUTH.USERNAME' | translate" />
  </tui-textfield>

  <tui-textfield iconStart="@tui.lock">
    <label
      tuiLabel
      for="password">
      {{ 'AUTH.PASSWORD' | translate }}
    </label>
    <input
      tuiInput
      id="password"
      autocomplete="current-password"
      formControlName="password"
      type="password"
      [placeholder]="'AUTH.PASSWORD' | translate" />

    <tui-icon
      icon="@tui.message-circle-question-mark"
      [tuiTooltip]="'AUTH.PASSWORD_STRENGTH.HINT' | translate"></tui-icon>
  </tui-textfield>

  <footer>
    <button
      tuiButton
      type="submit">
      <tui-icon icon="@tui.log-in" />
      {{ 'AUTH.SIGN_IN' | translate }}
    </button>

    <button
      appearance="outline"
      tuiButton
      type="button"
      routerLink="/auth/register">
      <tui-icon icon="@tui.user-plus" />
      {{ 'AUTH.SIGN_UP' | translate }}
    </button>
  </footer>
</form>
