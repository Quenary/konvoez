@let _user = user();

<button
  style="width: 100%; box-sizing: border-box"
  tuiCell
  appearance="whiteblock"
  type="button"
  (click)="selected.emit(_user)">
  <tui-badged-content class="chat-badge">
    @if (!isSelf() && unreadCountsStore.directUnreadCount(_user.id); as count) {
      <tui-badge-notification
        size="s"
        tuiSlot="top">
        {{ count > 99 ? '99+' : count }}
      </tui-badge-notification>
    }
    @if (isOnline()) {
      <tui-badge-notification
        size="xs"
        tuiSlot="bottom"
        class="online-badge" />
    }
    @if (isSelf()) {
      <div
        [tuiAvatar]="icons.bookmark"
        size="m"></div>
    } @else {
      <app-user-avatar
        size="m"
        [username]="_user.username"
        [fullname]="_user.fullname"
        [avatarUrl]="_user.avatarUrl" />
    }
  </tui-badged-content>

  <div tuiTitle>
    @if (isSelf()) {
      <span tuiFade>
        {{ 'DIRECT.SAVED_MESSAGES' | translate }}
      </span>
    } @else {
      <span
        [style.color]="_user.username | tuiAutoColor"
        tuiFade>
        {{ _user.username }}
      </span>
      <div
        tuiSubtitle
        tuiFade>
        {{ _user.fullname }}
      </div>
    }
  </div>

  <tui-icon
    [icon]="icons['chevron-right']"
    tuiAccessories />
</button>
