<button
  style="width: 100%; box-sizing: border-box"
  tuiCell
  appearance="whiteblock"
  type="button"
  (click)="selected.emit(user())">
  <tui-badged-content class="chat-badge">
    @if (unreadCountsStore.directUnreadCount(user().id); as count) {
      <tui-badge-notification
        size="s"
        tuiSlot="top">
        {{ count > 99 ? '99+' : count }}
      </tui-badge-notification>
    }
    <div
      tuiAvatar
      size="m">
      @if (user().avatarUrl) {
        <img
          [alt]="user().username"
          [ngSrc]="user().avatarUrl!"
          fill />
      } @else {
        {{ user().fullname | tuiInitials }}
      }
    </div>
  </tui-badged-content>

  <div tuiTitle>
    <span [style.color]="user().username | tuiAutoColor">
      {{ user().username }}
    </span>
    <div tuiSubtitle>{{ user().fullname }}</div>
  </div>

  <tui-icon
    icon="@tui.chevron-right"
    tuiAccessories />
</button>
