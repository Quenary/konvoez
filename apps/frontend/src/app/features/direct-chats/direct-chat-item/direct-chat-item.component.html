@let _user = user();

<app-list-item (click)="selected.emit(_user)">
  <tui-badged-content
    listItemLeading
    class="chat-badge">
    @if (!isSelf() && unreadCountsStore.directUnreadCount(_user.id); as count) {
      <tui-badge-notification
        size="s"
        tuiSlot="top">
        {{ count > 99 ? '99+' : count }}
      </tui-badge-notification>
    }
    @if (isOnline()) {
      <tui-badge-notification
        size="xs"
        tuiSlot="bottom"
        class="online-badge" />
    }
    @if (isSelf()) {
      <div
        [tuiAvatar]="icons.bookmark"
        size="m"></div>
    } @else {
      <app-user-avatar
        size="m"
        [username]="_user.username"
        [fullname]="_user.fullname"
        [avatarUrl]="_user.avatarUrl" />
    }
  </tui-badged-content>

  @if (isSelf()) {
    <span tuiFade>
      {{ 'DIRECT.SAVED_MESSAGES' | translate }}
    </span>
  } @else {
    <span
      [style.color]="_user.username | tuiAutoColor"
      tuiFade>
      {{ _user.username }}
    </span>
    <div
      tuiSubtitle
      tuiFade>
      {{ _user.fullname }}
    </div>
  }
</app-list-item>
