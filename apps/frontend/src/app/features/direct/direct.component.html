@if (isCurrentDirectCallActive()) {
  <div
    class="view-layer"
    [class.view-layer-hidden]="view() !== 'call'">
    <app-voice-room-shell
      [title]="title()"
      [avatarUrl]="avatarUrl()"
      [headerActions]="toChatActions"
      (left)="onCallLeft()" />
  </div>
}

<ng-template #toChatActions>
  <button
    tuiIconButton
    appearance="flat"
    size="s"
    iconStart="@tui.message-circle"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.TO_CHAT' | translate"
    (click)="showChat()">
    {{ 'CALL.TO_CHAT' | translate }}
  </button>
</ng-template>

@if (recipientId(); as id) {
  <div
    class="view-layer"
    [class.view-layer-hidden]="view() !== 'chat'">
    <app-chat
      [recipientId]="id"
      [title]="title()"
      [avatarUrl]="avatarUrl()">
      <div chatHeaderActions>
        @if (user(); as directUser) {
          @if (isCurrentDirectCallActive()) {
            <button
              tuiIconButton
              appearance="positive"
              size="s"
              iconStart="@tui.phone-call"
              type="button"
              tuiHintAppearance="floating"
              [tuiHint]="'CALL.TO_CALL' | translate"
              (click)="showCall()">
              {{ 'CALL.TO_CALL' | translate }}
            </button>
            <button
              tuiIconButton
              appearance="negative"
              size="s"
              iconStart="@tui.phone-off"
              type="button"
              tuiHintAppearance="floating"
              [tuiHint]="'CALL.HANGUP' | translate"
              (click)="hangup()">
              {{ 'CALL.HANGUP' | translate }}
            </button>
          } @else if (canRejoinCall()) {
            <app-pulse-indicator
              variant="glow"
              shape="rounded">
              <button
                tuiIconButton
                appearance="positive"
                size="s"
                iconStart="@tui.phone-call"
                type="button"
                tuiHintAppearance="floating"
                [tuiHint]="'CALL.JOIN_CALL' | translate"
                (click)="rejoinDirectCall(directUser)">
                {{ 'CALL.JOIN_CALL' | translate }}
              </button>
            </app-pulse-indicator>
          } @else {
            <button
              tuiIconButton
              appearance="flat"
              size="s"
              iconStart="@tui.phone"
              type="button"
              tuiHintAppearance="floating"
              [tuiHint]="'CALL.START_CALL' | translate"
              (click)="startDirectCall(directUser)">
              {{ 'CALL.START_CALL' | translate }}
            </button>
          }
        }
      </div>
    </app-chat>
  </div>
}
