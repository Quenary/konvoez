@let _avatarUrl = avatarUrl();
@let _title = title();
@let _initialsSource = initialsSource();

<div class="view-layer">
  @if (view() === 'call') {
    <app-voice-room-shell
      [title]="_title"
      [initialsSource]="_initialsSource"
      [isDirect]="true"
      [avatarUrl]="_avatarUrl"
      [backRoute]="'/direct'"
      [headerActions]="toChatActions"
      (headerClick)="openDetails()" />
  } @else {
    @if (recipientId(); as id) {
      <app-chat
        [recipientId]="id"
        [title]="_title"
        [initialsSource]="_initialsSource"
        [avatarUrl]="_avatarUrl"
        [avatarIcon]="avatarIcon()"
        [isOnline]="isOnline()"
        [initialMessageId]="heldMessageId()"
        (initialMessageApplied)="releaseMessageJump()"
        (headerClick)="openDetails()">
        <div chatHeaderActions>
          @if (!isSelf() && user(); as directUser) {
            @if (isCurrentDirectCallActive()) {
              <div tuiGroup>
                <button
                  tuiIconButton
                  appearance="positive"
                  size="s"
                  [iconStart]="icons['phone-call']"
                  type="button"
                  tuiHintAppearance="floating"
                  [tuiHint]="'CALL.TO_CALL' | translate"
                  (click)="showCall()">
                  {{ 'CALL.TO_CALL' | translate }}
                </button>
                <button
                  tuiIconButton
                  appearance="negative"
                  size="s"
                  [iconStart]="icons['phone-off']"
                  type="button"
                  tuiHintAppearance="floating"
                  [tuiHint]="'CALL.HANGUP' | translate"
                  (click)="hangup()">
                  {{ 'CALL.HANGUP' | translate }}
                </button>
              </div>
            } @else if (canRejoinCall()) {
              <app-pulse-indicator
                variant="glow"
                shape="rounded">
                <button
                  tuiIconButton
                  appearance="positive"
                  size="s"
                  [iconStart]="icons['phone-call']"
                  type="button"
                  tuiHintAppearance="floating"
                  [tuiHint]="'CALL.JOIN_CALL' | translate"
                  (click)="rejoinDirectCall(directUser)">
                  {{ 'CALL.JOIN_CALL' | translate }}
                </button>
              </app-pulse-indicator>
            } @else {
              <button
                tuiIconButton
                appearance="flat"
                size="s"
                [iconStart]="icons.phone"
                type="button"
                tuiHintAppearance="floating"
                [tuiHint]="'CALL.START_CALL' | translate"
                (click)="startDirectCall(directUser)">
                {{ 'CALL.START_CALL' | translate }}
              </button>
            }
          }
        </div>
      </app-chat>
    }
  }
</div>

<ng-template #toChatActions>
  <button
    tuiIconButton
    appearance="flat"
    size="s"
    [iconStart]="icons['message-circle']"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.TO_CHAT' | translate"
    (click)="showChat()">
    {{ 'CALL.TO_CHAT' | translate }}
  </button>
</ng-template>
