<tui-data-list>
  <tui-opt-group [label]="room().name">
    <button
      tuiOption
      [iconEnd]="icons.info"
      type="button"
      (click)="onOpenDetails()">
      {{ 'ROOMS.DETAILS' | translate }}
    </button>
    @if (canManage()) {
      <hr />
      <button
        tuiOption
        [iconEnd]="icons.edit"
        type="button"
        (click)="onEdit()">
        {{ 'GENERAL.EDIT' | translate }}
      </button>
      <button
        tuiOption
        [style.color]="'var(--tui-status-negative)'"
        [iconEnd]="icons.delete"
        type="button"
        (click)="onDelete()">
        {{ 'GENERAL.DELETE' | translate }}
      </button>
    }
  </tui-opt-group>
</tui-data-list>
