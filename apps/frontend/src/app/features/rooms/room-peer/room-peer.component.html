@if (peer(); as p) {
  <div tuiAsideItem>
    <div
      tuiAvatar
      size="s"
      class="avatar"
      [class.talking]="audioLevel() > 0">
      @if (p.avatarUrl) {
        <img
          [alt]="p.username"
          [ngSrc]="p.avatarUrl" />
      } @else {
        {{ p.username | tuiInitials }}
      }
    </div>

    {{ p.username }}
  </div>
}
