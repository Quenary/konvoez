@let p = peer();

<div
  tuiAvatar
  size="s"
  [class.talking]="audioLevel() > 0">
  @if (p.avatarUrl) {
    <img
      [alt]="p.username"
      [ngSrc]="p.avatarUrl"
      fill />
  } @else {
    {{ p.fullname | tuiInitials }}
  }
</div>

<span [style.color]="p.username | tuiAutoColor">
  {{ p.username }}
</span>
