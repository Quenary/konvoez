@let p = peer();
@let hintValue = p.fullname && p.fullname !== p.username ? p.fullname : null;

<app-user-avatar
  size="xs"
  [username]="p.username"
  [fullname]="p.fullname"
  [avatarUrl]="p.avatarUrl"
  [talking]="isSpeaking()" />

<span
  class="peer-name"
  tuiFade
  tuiHintAppearance="floating"
  [style.color]="p.username | tuiAutoColor"
  [tuiHint]="hintValue">
  {{ p.username }}
</span>

@if (isMuted() || isDeafened()) {
  <span class="status-icons">
    @if (isMuted()) {
      <tui-icon
        icon="@tui.mic-off"
        [tuiHint]="'CALL.MICROPHONE_MUTED' | translate"
        tuiHintAppearance="floating" />
    }
    @if (isDeafened()) {
      <tui-icon
        icon="@tui.headphone-off"
        [tuiHint]="'CALL.SPEAKER_OFF' | translate"
        tuiHintAppearance="floating" />
    }
  </span>
}
