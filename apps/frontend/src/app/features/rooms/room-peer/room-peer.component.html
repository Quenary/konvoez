@if (peer(); as p) {
  <div tuiAsideItem>
    <div
      tuiAvatar
      size="s"
      class="avatar"
      [class.talking]="audioLevel() > 0">
      @if (p.avatarUrl) {
        <img
          [alt]="p.username"
          [ngSrc]="p.avatarUrl"
          fill />
      } @else {
        {{ p.fullname | tuiInitials }}
      }
    </div>

    <span
      class="username"
      [style.color]="p.username | tuiAutoColor">
      {{ p.username }}
    </span>
  </div>
}
