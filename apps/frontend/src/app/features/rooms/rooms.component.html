<button
  tuiAsideItem
  routerLink="/direct"
  routerLinkActive="active">
  <tui-badged-content class="aside-badge aside-badge--icon">
    @if (unreadCountsStore.directTotal(); as count) {
      <tui-badge-notification
        size="s"
        tuiSlot="top">
        <ng-container
          [ngTemplateOutlet]="countTmpl"
          [ngTemplateOutletContext]="{ $implicit: count }"></ng-container>
      </tui-badge-notification>
    }
    <tui-icon [icon]="icons.direct" />
  </tui-badged-content>
  {{ 'MENU.DIRECT' | translate }}
</button>

@if (hangingCallPeer(); as peer) {
  <button
    class="hanging-call"
    tuiAsideItem
    type="button"
    [ariaLabel]="'CALL.DIRECT_CALL' | translate"
    (click)="openHangingCall(peer)">
    <app-pulse-indicator variant="glow">
      <app-user-avatar
        size="xs"
        [username]="peer.username"
        [fullname]="peer.fullname"
        [avatarUrl]="peer.avatarUrl" />
    </app-pulse-indicator>
    <span
      tuiHintAppearance="floating"
      [style.color]="peer.username | tuiAutoColor"
      [tuiHint]="
        peer.fullname && peer.fullname !== peer.username ? peer.fullname : null
      ">
      {{ peer.username }}
    </span>
  </button>
}

<button
  [style.margin-top.rem]="1"
  [style.color]="'var(--tui-text-secondary)'"
  tuiAsideItem
  [iconStart]="icons['text-rooms']"
  routerLink="/text-room"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }">
  {{ 'MENU.TEXT' | translate }}
  @if (canManageRooms()) {
    <button
      [style.margin-left]="'auto'"
      tuiIconButton
      [iconStart]="icons.add"
      (click)="addRoom(ERoomType.TEXT); $event.stopPropagation()">
    </button>
  }
</button>

<app-room-aside-list
  [type]="ERoomType.TEXT"
  [collapsed]="collapsed()" />

<button
  [style.margin-top.rem]="1"
  [style.color]="'var(--tui-text-secondary)'"
  tuiAsideItem
  [iconStart]="icons['audio-lines']"
  routerLink="/voice-room"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }">
  {{ 'MENU.VOICE' | translate }}
  @if (canManageRooms()) {
    <button
      [style.margin-left]="'auto'"
      tuiIconButton
      [iconStart]="icons.add"
      (click)="addRoom(ERoomType.VOICE); $event.stopPropagation()">
    </button>
  }
</button>

<app-room-aside-list
  [type]="ERoomType.VOICE"
  [collapsed]="collapsed()" />

<ng-template
  #countTmpl
  let-count>
  {{ count > 99 ? '99+' : count }}
</ng-template>
