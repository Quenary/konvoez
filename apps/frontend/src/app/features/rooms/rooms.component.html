<button
  tuiAsideItem
  routerLink="/direct"
  routerLinkActive="active">
  <tui-badged-content class="aside-badge aside-badge--icon">
    @if (unreadCountsStore.directTotal(); as count) {
      <tui-badge-notification
        size="s"
        tuiSlot="top">
        <ng-container
          [ngTemplateOutlet]="countTmpl"
          [ngTemplateOutletContext]="{ $implicit: count }"></ng-container>
      </tui-badge-notification>
    }
    <tui-icon icon="@tui.messages-square" />
  </tui-badged-content>
  {{ 'MENU.DIRECT' | translate }}
</button>

@if (hangingCallPeer(); as peer) {
  <button
    class="hanging-call"
    tuiAsideItem
    type="button"
    [ariaLabel]="'CALL.DIRECT_CALL' | translate"
    (click)="openHangingCall(peer)">
    <app-pulse-indicator variant="glow">
      <app-user-avatar
        size="xs"
        [username]="peer.username"
        [fullname]="peer.fullname"
        [avatarUrl]="peer.avatarUrl" />
    </app-pulse-indicator>
    <span
      tuiHintAppearance="floating"
      [style.color]="peer.username | tuiAutoColor"
      [tuiHint]="
        peer.fullname && peer.fullname !== peer.username ? peer.fullname : null
      ">
      {{ peer.username }}
    </span>
  </button>
}

<button
  [style.margin-top.rem]="1"
  [style.color]="'var(--tui-text-secondary)'"
  tuiAsideItem
  iconStart="@tui.message-circle-more">
  {{ 'MENU.TEXT' | translate }}
  @if (canManageRooms()) {
    <button
      [style.margin-left]="'auto'"
      tuiIconButton
      appearance="positive"
      iconStart="@tui.plus"
      (click)="addRoom(ERoomType.TEXT); $event.stopPropagation()">
    </button>
  }
</button>

@for (room of textRooms(); track room.id) {
  <button
    class="room-item"
    tuiAsideItem
    [tuiDropdown]="canManageRooms() ? roomContextMenu : null"
    tuiDropdownContext
    (longtap)="onRoomLongtap(room)"
    (click)="onRoomClick(room)">
    <tui-badged-content class="aside-badge">
      @if (unreadCountsStore.roomUnreadCount(room.id); as count) {
        <tui-badge-notification
          size="s"
          tuiSlot="top">
          <ng-container
            [ngTemplateOutlet]="countTmpl"
            [ngTemplateOutletContext]="{ $implicit: count }"></ng-container>
        </tui-badge-notification>
      }
      <div
        tuiAvatar
        size="xs">
        @if (room.avatarUrl) {
          <img
            [alt]="room.name"
            [ngSrc]="room.avatarUrl"
            fill
            priority />
        } @else {
          {{ room.name | tuiInitials }}
        }
      </div>
    </tui-badged-content>
    {{ room.name }}
  </button>
}

<button
  [style.margin-top.rem]="1"
  [style.color]="'var(--tui-text-secondary)'"
  tuiAsideItem
  iconStart="@tui.audio-lines">
  {{ 'MENU.VOICE' | translate }}
  @if (canManageRooms()) {
    <button
      [style.margin-left]="'auto'"
      tuiIconButton
      appearance="positive"
      iconStart="@tui.plus"
      (click)="addRoom(ERoomType.VOICE); $event.stopPropagation()">
    </button>
  }
</button>

@for (room of voiceRooms(); track room.id) {
  <button
    class="room-item"
    tuiAsideItem
    [tuiDropdown]="canManageRooms() ? roomContextMenu : null"
    tuiDropdownContext
    (longtap)="onRoomLongtap(room)"
    (click)="onRoomClick(room)">
    <app-pulse-indicator [isActive]="room.isUserInRoom">
      <div
        tuiAvatar
        size="xs">
        @if (room.avatarUrl) {
          <img
            [alt]="room.name"
            [ngSrc]="room.avatarUrl"
            fill
            priority />
        } @else {
          {{ room.name | tuiInitials }}
        }
      </div>
    </app-pulse-indicator>
    {{ room.name }}
  </button>

  @if (!collapsed()) {
    @for (peer of room.peers; track peer.id) {
      <app-room-peer
        class="room-peer-item"
        [peer]="peer"></app-room-peer>
    }
  }
}

<ng-template
  #roomContextMenu
  let-close>
  @if (contextMenuOpenedFor(); as room) {
    <app-room-context-menu
      [roomName]="room.name"
      (edit)="editRoom(room); close()"
      (delete)="deleteRoom(room); close()" />
  }
</ng-template>

<ng-template
  #countTmpl
  let-count>
  {{ count > 99 ? '99+' : count }}
</ng-template>
