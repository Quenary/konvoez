@if (isSessionActive()) {
  <div
    tuiGroup
    [orientation]="collapsed() ? 'vertical' : 'horizontal'">
    <button
      tuiButton
      appearance="neutral"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="qualityHintTemplate"
      [attr.aria-label]="qualityAriaLabel()"
      class="panel-button-spaced"
      (click)="clickSession()">
      <tui-icon
        [icon]="icons['audio-lines']"
        [style.color]="qualityColor()"></tui-icon>
      @if (!collapsed()) {
        <span tuiFade>{{ sessionTitle() | translate }}</span>
      }
    </button>
    <button
      tuiIconButton
      [iconStart]="icons['log-out']"
      appearance="negative"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="'CALL.HANGUP' | translate"
      class="panel-button-fixed"
      (click)="leaveSession()">
    </button>
  </div>

  <ng-template #qualityHintTemplate>
    @if (collapsed()) {
      <div>{{ sessionTitle() | translate }}</div>
    }
    <div>
      {{ qualityHintKey() | translate: { kbps: qualityBitrateKbps() } }}
    </div>
  </ng-template>
}

<div
  tuiGroup
  [orientation]="collapsed() ? 'vertical' : 'horizontal'">
  <button
    tuiIconButton
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="micHintKey() | translate"
    [iconStart]="microphoneMuted() ? icons['mic-off'] : icons.mic"
    [appearance]="microphoneMuted() ? 'negative' : 'neutral'"
    (click)="toggleMicrophoneMuted()">
  </button>
  <button
    tuiIconButton
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="speakerHintKey() | translate"
    [iconStart]="speakerMuted() ? icons['headphone-off'] : icons.headphones"
    [appearance]="speakerMuted() ? 'negative' : 'neutral'"
    (click)="toggleSpeakerMuted()">
  </button>
  @if (cameraOn()) {
    <button
      tuiIconButton
      [iconStart]="icons.video"
      appearance="primary"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="'CALL.CAMERA_OFF' | translate"
      (click)="stopCamera()">
    </button>
  }
  @if (screenOn()) {
    <button
      tuiIconButton
      [iconStart]="icons['screen-share-off']"
      appearance="primary"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="'CALL.SCREEN_OFF' | translate"
      (click)="stopScreen()">
    </button>
  }
  <button
    tuiIconButton
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.OPEN_DEVICES_SETTINGS' | translate"
    [iconStart]="icons.settings"
    appearance="neutral"
    (click)="openDevicesSettings()">
  </button>
</div>
