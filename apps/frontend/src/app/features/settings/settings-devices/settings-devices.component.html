<div
  appearance="floating"
  tuiCardLarge
  tuiForm="m">
  <header tuiHeader>
    <div tuiTitle>
      {{ 'SETTINGS.DEVICES.TITLE' | translate }}
    </div>

    <aside tuiAccessories>
      <button
        tuiButton
        size="m"
        type="button"
        appearance="flat"
        iconStart="@tui.refresh-cw"
        [loading]="devicesLoad.isLoading()"
        (click)="devicesLoad.reload()">
      </button>
    </aside>
  </header>

  <ng-template
    #deviceStatusIcon
    let-value>
    @if (value) {
      <tui-icon
        icon="@tui.badge-check"
        style="color: var(--tui-status-positive); pointer-events: none" />
    } @else {
      <tui-icon
        icon="@tui.triangle-alert"
        style="color: var(--tui-status-negative); pointer-events: none" />
    }
  </ng-template>

  <label tuiLabel>
    {{ 'SETTINGS.DEVICES.AUDIO_INPUT' | translate }}
    <tui-textfield
      iconStart="@tui.mic"
      tuiChevron
      tuiTextfieldSize="m"
      [tuiTextfieldCleaner]="false">
      <input
        tuiSelect
        [ngModel]="audioInput()"
        (ngModelChange)="onSelectAudioInput($event)" />

      <tui-data-list-wrapper
        *tuiDropdown
        [items]="audioInputList()" />

      <ng-container
        [ngTemplateOutlet]="deviceStatusIcon"
        [ngTemplateOutletContext]="{
          $implicit: audioInputAvailable(),
        }">
      </ng-container>
    </tui-textfield>
  </label>

  <label tuiLabel>
    {{ 'CALL.STREAM_HEIGHT' | translate }}
    <tui-textfield
      tuiChevron
      tuiTextfieldSize="m"
      [tuiTextfieldCleaner]="false">
      <input
        tuiSelect
        [ngModel]="streamHeight()"
        (ngModelChange)="onSelectStreamHeight($event)" />
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="streamHeights"
        [itemContent]="heightContent" />
    </tui-textfield>
  </label>

  <ng-template
    #heightContent
    let-item>
    {{ item }}p
  </ng-template>

  <ng-template
    #fpsContent
    let-item>
    {{ item }}
  </ng-template>

  <label tuiLabel>
    {{ 'CALL.STREAM_FPS' | translate }}
    <tui-textfield
      tuiChevron
      tuiTextfieldSize="m"
      [tuiTextfieldCleaner]="false">
      <input
        tuiSelect
        [ngModel]="streamFps()"
        (ngModelChange)="onSelectStreamFps($event)" />
      <tui-data-list-wrapper
        *tuiDropdown
        [items]="streamFpsOptions"
        [itemContent]="fpsContent" />
    </tui-textfield>
  </label>

  <label tuiLabel>
    {{ 'SETTINGS.DEVICES.AUDIO_OUTPUT' | translate }}
    <tui-textfield
      iconStart="@tui.headphones"
      tuiChevron
      tuiTextfieldSize="m"
      [tuiTextfieldCleaner]="false">
      <input
        tuiSelect
        [ngModel]="audioOutput()"
        (ngModelChange)="onSelectAudioOutput($event)" />

      <tui-data-list-wrapper
        *tuiDropdown
        [items]="audioOutputList()" />

      <ng-container
        [ngTemplateOutlet]="deviceStatusIcon"
        [ngTemplateOutletContext]="{
          $implicit: audioOutputAvailable(),
        }">
      </ng-container>

      <tui-icon
        icon="@tui.message-circle-question-mark"
        [tuiTooltip]="'SETTINGS.DEVICES.API_NOT_AVAILABLE' | translate">
      </tui-icon>
    </tui-textfield>
  </label>
</div>
