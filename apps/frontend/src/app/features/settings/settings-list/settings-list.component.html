<app-route-page>
  <header tuiHeader>
    <h2 tuiTitle>
      <tui-icon [icon]="icons.settings" />
      <span tuiFade>{{ 'SETTINGS.TITLE' | translate }}</span>
    </h2>
  </header>

  <div class="settings-list">
    @for (entry of settingsList.entries(); track entry.link) {
      <app-list-item [link]="entry.link">
        <tui-icon
          listItemLeading
          [icon]="entry.icon" />
        <span tuiFade>{{ entry.labelKey | translate }}</span>
      </app-list-item>
    }
  </div>
</app-route-page>
