<form
  appearance="floating"
  tuiCardLarge
  tuiForm="m"
  novalidate>
  <header tuiHeader>
    <h2 tuiTitle>
      {{ 'SETTINGS.NOTIFICATIONS.TITLE' | translate }}
      <span tuiSubtitle>
        {{ 'SETTINGS.NOTIFICATIONS.SUBTITLE' | translate }}
      </span>
    </h2>
  </header>

  <div class="setting-item">
    <div class="status-row">
      <span class="status-label">{{
        'SETTINGS.NOTIFICATIONS.STATUS' | translate
      }}</span>
      <span
        class="status-badge"
        [class.enabled]="isEnabled()"
        [class.disabled]="!isEnabled()">
        {{
          (isEnabled()
            ? 'SETTINGS.NOTIFICATIONS.ENABLED'
            : 'SETTINGS.NOTIFICATIONS.DISABLED'
          ) | translate
        }}
      </span>
    </div>
  </div>

  <footer>
    <button
      tuiButton
      type="button"
      [appearance]="isEnabled() ? 'accent' : 'primary'"
      [disabled]="!isSupported()"
      [loading]="isLoading()"
      (click)="onToggle()">
      {{
        (isEnabled()
          ? 'SETTINGS.NOTIFICATIONS.DISABLE'
          : 'SETTINGS.NOTIFICATIONS.ENABLE'
        ) | translate
      }}
    </button>
  </footer>
</form>
