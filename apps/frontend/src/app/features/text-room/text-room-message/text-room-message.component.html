@if (message(); as m) {
  <div
    class="message"
    [tuiDropdown]="hasMenu() ? contextMenu : null"
    tuiDropdownContext>
    <div
      tuiAvatar
      size="s"
      class="message-sender"
      [round]="true">
      @if (avatarUrl(); as url) {
        <img
          [alt]="m.senderUsername"
          [ngSrc]="url"
          fill />
      } @else {
        {{ m.senderUsername | tuiInitials }}
      }
    </div>

    <span class="message-body">
      <span class="message-body-header">
        <span class="message-body-header-username">
          {{ m.senderUsername }}
        </span>
        <span class="message-body-header-date">
          {{ m.createdAt | dayjs }}
        </span>
      </span>

      <tui-editor-socket
        class="message-body-content"
        [content]="sanitizedContent()">
      </tui-editor-socket>
    </span>
  </div>

  <ng-template
    #contextMenu
    let-close>
    <tui-data-list>
      @if (canEdit()) {
        <button
          tuiOption
          iconEnd="@tui.edit"
          (click)="editMessage(); close()">
          {{ 'GENERAL.EDIT' | translate }}
        </button>
      }
      @if (canDelete()) {
        <button
          tuiOption
          iconEnd="@tui.delete"
          (click)="deleteMessage(); close()">
          {{ 'GENERAL.DELETE' | translate }}
        </button>
      }
    </tui-data-list>
  </ng-template>
}
