@if (message(); as m) {
  <div
    class="message"
    #messageRef
    aria-haspopup="true">
    <!-- @if (avatarUrl(); as image) {
      <p-avatar
        class="message-sender"
        [image]="image"
        shape="circle">
      </p-avatar>
    } @else { -->
    <p-avatar
      class="message-sender"
      [label]="m.senderUsername[0]"
      shape="circle">
    </p-avatar>
    <!-- } -->
    <span class="message-body">
      <span class="message-body-header">
        <span class="message-body-header-username">
          {{ m.senderUsername }}
        </span>
        <span class="message-body-header-date">
          {{ m.createdAt | dayjs }}
        </span>
      </span>
      <angular-tiptap-editor
        class="message-body-content"
        [content]="m.content"
        [editable]="false"
        [seamless]="true"
        [config]="{ theme: 'dark' }">
      </angular-tiptap-editor>
    </span>
  </div>

  <p-contextmenu
    [target]="messageRef"
    appendTo="body"
    [model]="contextMenu()">
  </p-contextmenu>
}
