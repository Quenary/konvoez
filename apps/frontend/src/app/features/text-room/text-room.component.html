@if (roomId(); as id) {
  <app-chat
    [roomId]="id"
    [title]="title()"
    [avatarUrl]="avatarUrl()"
    [initialMessageId]="targetMessageId()"
    (headerClick)="openDetails()">
    @if (room(); as currentRoom) {
      <div chatHeaderActions>
        <button
          tuiIconButton
          appearance="flat"
          size="s"
          [iconStart]="icons['ellipsis-vertical']"
          type="button"
          tuiDropdownAuto
          [tuiDropdown]="roomContextMenu"
          [tuiDropdownSided]="true"
          tuiHintAppearance="floating"
          [tuiHint]="'GENERAL.MORE' | translate">
          {{ 'GENERAL.MORE' | translate }}
        </button>

        <ng-template
          #roomContextMenu
          let-close>
          <app-room-context-menu
            [roomName]="currentRoom.name"
            [canManage]="canManageRooms()"
            (details)="openDetails(); close()"
            (edit)="editRoom(currentRoom); close()"
            (delete)="deleteRoom(currentRoom); close()" />
        </ng-template>
      </div>
    }
  </app-chat>
}
