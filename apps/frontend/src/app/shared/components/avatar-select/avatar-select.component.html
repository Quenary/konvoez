<div class="avatar-select">
  <label tuiInputFiles>
    <input
      #fileInput
      tuiInputFiles
      [id]="inputId()"
      accept="image/*"
      [maxFileSize]="maxFileSize()"
      [formControl]="control()"
      type="file" />

    <ng-template let-dragged>
      @if (dragged) {
        <div
          appearance="secondary"
          size="xxl"
          [tuiAvatar]="icons.droplet">
        </div>
        <div>
          {{ 'GENERAL.DROP_IT' | translate }}
        </div>
      } @else {
        @if (avatarUrl(); as au) {
          <div
            appearance="secondary"
            size="xxl"
            tuiAvatar>
            <img
              [ngSrc]="au"
              fill
              [priority]="priority()"
              [alt]="au" />
          </div>
        } @else {
          <div
            appearance="secondary"
            size="xxl"
            [tuiAvatar]="icons['cloud-upload']">
          </div>
        }

        <div>
          {{ 'GENERAL.DRAG_FILE' | translate }}
          {{ 'GENERAL.OR' | translate | lowercase }}
          <a tuiLink>
            {{ 'GENERAL.CLICK_TO_SELECT' | translate | lowercase }}
          </a>
        </div>
      }
    </ng-template>
  </label>

  @if (avatarUrl()) {
    <button
      tuiIconButton
      type="button"
      size="xs"
      appearance="secondary"
      class="avatar-select-remove"
      [iconStart]="icons.close"
      [disabled]="isDisabled()"
      [attr.aria-label]="'GENERAL.DELETE' | translate"
      [tuiHint]="'GENERAL.DELETE' | translate"
      (click)="onRemove($event)">
    </button>
  }
</div>
