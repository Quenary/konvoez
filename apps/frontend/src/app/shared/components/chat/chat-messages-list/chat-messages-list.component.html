<div
  #scrollContainer
  class="scroll-container"
  infiniteScroll
  [infiniteScrollDistance]="1"
  [infiniteScrollUpDistance]="1"
  [infiniteScrollThrottle]="150"
  [scrollWindow]="false"
  [infiniteScrollDisabled]="infiniteScrollDisabled()"
  (scrolledUp)="onScrollUp()"
  (scrolled)="onScrolled()">
  @let unreadId = unreadDividerMessageId();
  @for (m of messages(); track m.id) {
    @if (unreadId && m.id === unreadId) {
      <app-chat-system-item id="unread-divider">
        {{ 'CHAT.UNREAD_MESSAGES' | translate }}
      </app-chat-system-item>
    }
    <app-chat-message [message]="m"> </app-chat-message>
  }
</div>

@if (showScrollToBottom()) {
  <button
    class="scroll-to-bottom"
    tuiIconButton
    type="button"
    iconStart="@tui.arrow-down"
    size="s"
    [tuiHint]="'ROOMS.SCROLL_TO_BOTTOM' | translate"
    (click)="scrollToBottom('smooth')">
    {{ 'ROOMS.SCROLL_TO_BOTTOM' | translate }}
  </button>
}
