<header
  tuiHeader
  class="room-header">
  @if (title(); as currentTitle) {
    <h2 tuiTitle>
      <tui-badged-content class="header-avatar-badge">
        @if (isOnline()) {
          <tui-badge-notification
            size="xs"
            tuiSlot="bottom"
            class="online-badge" />
        }
        <div
          tuiAvatar
          size="s"
          class="header-avatar">
          @if (avatarIcon(); as icon) {
            <tui-icon [icon]="icon" />
          } @else if (avatarUrl()) {
            <img
              [alt]="currentTitle"
              [ngSrc]="avatarUrl()!"
              fill
              priority />
          } @else {
            {{ currentTitle | tuiInitials }}
          }
        </div>
      </tui-badged-content>

      <span [style.color]="colorTitle() ? (currentTitle | tuiAutoColor) : null">
        {{ currentTitle }}
      </span>
    </h2>
  }

  <aside tuiAccessories>
    <ng-content select="[chatHeaderActions]" />

    <button
      tuiIconButton
      appearance="flat"
      size="s"
      [iconStart]="icons.search"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="'GENERAL.SEARCH' | translate"
      (click)="toggleSearch()">
      {{ 'GENERAL.SEARCH' | translate }}
    </button>
  </aside>

  @if (chatStore.isSearchOpen()) {
    <tui-textfield
      [iconStart]="icons.search"
      [tuiTextfieldCleaner]="false"
      class="search-textfield">
      <input
        tuiInput
        [formControl]="searchControl"
        [placeholder]="'ROOMS.SEARCH_MESSAGES' | translate"
        tuiAutoFocus />
      @if (searchControl.value) {
        <button
          tuiIconButton
          appearance="flat"
          size="xs"
          [iconStart]="icons.close"
          type="button"
          tuiHintAppearance="floating"
          [tuiHint]="'GENERAL.CANCEL' | translate"
          (click)="clearSearch()">
        </button>
      }
      <button
        tuiIconButton
        appearance="flat"
        size="xs"
        [iconStart]="icons['chevron-up']"
        type="button"
        tuiHintAppearance="floating"
        [tuiHint]="'GENERAL.CLOSE' | translate"
        (click)="toggleSearch()">
      </button>
    </tui-textfield>
  }
</header>

<div
  class="chat-drop"
  appFileDrop
  (filesDropped)="onFilesDropped($event)">
  <app-chat-messages-list />
  <app-chat-editor
    [draftKey]="draftKey()"
    [mentionRoomId]="roomId()"
    [editableMessage]="chatStore.editableMessage()"
    [replyToMessage]="chatStore.replyToMessage()"
    (submitted)="onMessageSubmitted($event)"
    (edited)="onMessageEdited($event)"
    (replyCancelled)="onReplyCancelled()"
    (editCancelled)="onEditCancelled()" />
  <div class="drop-overlay">
    {{ 'ROOMS.DROP_FILES_HERE' | translate }}
  </div>
</div>
