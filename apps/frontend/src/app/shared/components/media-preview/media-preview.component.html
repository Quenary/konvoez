<tui-preview
  [rotatable]="isImage()"
  [zoomable]="isImage()">
  <tui-preview-title>{{ current().name }}</tui-preview-title>
  @if (items.length > 1) {
    <tui-preview-pagination
      [index]="index()"
      [length]="items.length"
      (indexChange)="onIndex($event)" />
  }
  @if (current().downloadUrl && !broken()) {
    <button
      [iconStart]="icons.download"
      tuiIconButton
      tuiPreviewAction
      type="button"
      [attr.aria-label]="'ROOMS.DOWNLOAD' | translate"
      (click)="download()">
    </button>
  }
  <button
    [iconStart]="icons.close"
    tuiIconButton
    tuiPreviewAction
    type="button"
    [attr.aria-label]="'GENERAL.CLOSE' | translate"
    (click)="close()">
  </button>
  @if (current(); as item) {
    @if (broken()) {
      <div class="unsupported">
        <p>{{ 'ROOMS.PREVIEW_UNSUPPORTED' | translate }}</p>
        @if (item.downloadUrl) {
          <button
            tuiButton
            type="button"
            (click)="download()">
            {{ 'ROOMS.DOWNLOAD' | translate }}
          </button>
        }
      </div>
    } @else if (item.kind === kinds.IMAGE) {
      <img
        [alt]="item.name"
        [src]="item.src"
        (error)="onBroken()" />
    } @else {
      <video
        autoplay
        controls
        playsinline
        [src]="item.src"
        (error)="onBroken()"></video>
    }
  }
</tui-preview>
