<ng-template
  [tuiNotificationOptions]="{
    label: (labelKey() | translate),
    autoClose: 0,
    closable: false,
    icon: icons.refresh,
  }"
  [(tuiNotification)]="show">
  <button
    tuiButton
    size="s"
    type="button"
    (click)="update()">
    {{ actionKey() | translate }}
  </button>
</ng-template>
