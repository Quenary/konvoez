<tui-data-list tuiDataListDropdownManager>
  <tui-opt-group [label]="peer().username">
    <button
      tuiOption
      [iconEnd]="icons.info"
      type="button"
      (click)="onOpenDetails()">
      {{ 'ROOMS.DETAILS' | translate }}
    </button>
    @if (showVolume()) {
      <button
        tuiOption
        [iconEnd]="volumeIcon()"
        tuiDropdownAlign="end"
        tuiDropdownSided
        type="button"
        [tuiDropdown]="volumeDropdown">
        {{ 'CALL.VOLUME' | translate }}
      </button>
    }
    @if (canModerate()) {
      <hr />
      @if (moveTargets().length > 0) {
        <button
          tuiOption
          [style.color]="'var(--tui-status-warning)'"
          [iconEnd]="icons['arrow-down-up']"
          tuiDropdownAlign="end"
          tuiDropdownSided
          type="button"
          [tuiDropdown]="moveTargetsMenu">
          {{ 'VOICE.MOVE_TO' | translate }}
        </button>
      }
      <button
        tuiOption
        [style.color]="'var(--tui-status-negative)'"
        [iconEnd]="icons['circle-x']"
        type="button"
        (click)="onDisconnectMember()">
        {{ 'VOICE.DISCONNECT_FROM_VOICE' | translate }}
      </button>
    }
  </tui-opt-group>
</tui-data-list>

<ng-template #volumeDropdown>
  <app-volume-control
    [id]="'user-context-volume-' + peer().id"
    [value]="volume()"
    [label]="'CALL.VOLUME' | translate"
    (valueChange)="onVolumeChange($event)" />
</ng-template>

<ng-template #moveTargetsMenu>
  <tui-data-list>
    @for (target of moveTargets(); track target.id) {
      <button
        tuiOption
        type="button"
        (click)="onMoveMember(target)">
        {{ target.name }}
      </button>
    }
  </tui-data-list>
</ng-template>
