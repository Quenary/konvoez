<div class="controls-container">
  <button
    tuiIconButton
    [appearance]="micMuted() ? 'negative' : 'neutral'"
    size="m"
    [iconStart]="micMuted() ? '@tui.mic-off' : '@tui.mic'"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'GENERAL.MUTE' | translate"
    (click)="toggleMicrophone()">
  </button>

  <button
    tuiIconButton
    [appearance]="speakerMuted() ? 'negative' : 'neutral'"
    size="m"
    [iconStart]="speakerMuted() ? '@tui.headphone-off' : '@tui.headphones'"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.SOUND' | translate"
    (click)="toggleSpeaker()">
  </button>

  <button
    tuiIconButton
    [appearance]="cameraOn() ? 'primary' : 'neutral'"
    size="m"
    [iconStart]="cameraOn() ? '@tui.video' : '@tui.video-off'"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="(cameraOn() ? 'CALL.CAMERA_OFF' : 'CALL.CAMERA_ON') | translate"
    (click)="toggleCamera()">
  </button>

  @if (screenSupported) {
    <button
      tuiIconButton
      [appearance]="screenOn() ? 'primary' : 'neutral'"
      size="m"
      [iconStart]="screenOn() ? '@tui.screen-share' : '@tui.screen-share'"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="
        (screenOn() ? 'CALL.SCREEN_OFF' : 'CALL.SCREEN_ON') | translate
      "
      (click)="toggleScreen()">
    </button>
  }

  <div class="controls-divider"></div>

  <button
    tuiIconButton
    appearance="negative"
    size="m"
    iconStart="@tui.phone-off"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.HANGUP' | translate"
    (click)="onHangupClick()">
  </button>
</div>
