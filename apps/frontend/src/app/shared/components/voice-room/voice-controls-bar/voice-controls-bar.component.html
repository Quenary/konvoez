<div class="controls-container">
  <button
    tuiIconButton
    [appearance]="micMuted() ? 'negative' : 'neutral'"
    size="m"
    [iconStart]="micMuted() ? '@tui.mic-off' : '@tui.mic'"
    type="button"
    [title]="'GENERAL.MUTE' | translate"
    (click)="toggleMicrophone()">
  </button>

  <button
    tuiIconButton
    [appearance]="speakerMuted() ? 'negative' : 'neutral'"
    size="m"
    [iconStart]="speakerMuted() ? '@tui.headphone-off' : '@tui.headphones'"
    type="button"
    [title]="'CALL.SOUND' | translate"
    (click)="toggleSpeaker()">
  </button>

  <button
    tuiIconButton
    appearance="neutral"
    size="m"
    iconStart="@tui.video-off"
    type="button"
    disabled
    [title]="'CALL.CAMERA_SOON' | translate">
  </button>

  <button
    tuiIconButton
    appearance="neutral"
    size="m"
    iconStart="@tui.screen-share"
    type="button"
    disabled
    [title]="'CALL.SCREEN_SOON' | translate">
  </button>

  <div class="controls-divider"></div>

  <button
    tuiIconButton
    appearance="negative"
    size="m"
    iconStart="@tui.phone-off"
    type="button"
    [title]="'CALL.HANGUP' | translate"
    (click)="onHangupClick()">
  </button>
</div>
