@let p = peer();
@let hintValue = p.fullname && p.fullname !== p.username ? p.fullname : null;

<div
  class="tile"
  [class.speaking]="isSpeaking()">
  @if (videoTrack()) {
    <video
      class="video"
      autoplay
      playsinline
      muted></video>
  } @else {
    <app-user-avatar
      class="avatar"
      size="xl"
      [username]="p.username"
      [fullname]="p.fullname"
      [avatarUrl]="p.avatarUrl"
      [talking]="isSpeaking()" />
  }

  <div class="badges">
    @if (isCalling()) {
      <tui-icon
        appearance="info"
        iconStart="@tui.phone-call"
        size="l"
        tuiBadge
        class="badge-calling"
        tuiHintAppearance="floating"
        [tuiHint]="'CALL.CALLING' | translate" />
    }
    @if (isMuted()) {
      <tui-icon
        appearance="negative"
        iconStart="@tui.mic-off"
        size="l"
        tuiBadge
        tuiHintAppearance="floating"
        [tuiHint]="'GENERAL.MUTE' | translate" />
    }
    @if (isDeafened()) {
      <tui-icon
        appearance="negative"
        iconStart="@tui.headphone-off"
        size="l"
        tuiBadge
        tuiHintAppearance="floating"
        [tuiHint]="'CALL.SOUND_OFF' | translate" />
    }
  </div>

  <div class="footer">
    <span
      appearance="neutral"
      size="m"
      tuiBadge
      class="name">
      <span
        tuiHintAppearance="floating"
        [style.color]="p.username | tuiAutoColor"
        [tuiHint]="hintValue">
        {{ p.username }}
      </span>
      @if (isLocal()) {
        <span class="you">({{ 'CALL.YOU' | translate }})</span>
      }
    </span>

    @if (!isLocal()) {
      <button
        tuiIconButton
        appearance="flat"
        size="s"
        type="button"
        tuiDropdownAuto
        tuiDropdownDirection="top"
        [iconStart]="volumeIcon()"
        [tuiDropdown]="volumeDropdown"
        tuiHintAppearance="floating"
        [tuiHint]="'CALL.VOLUME' | translate">
      </button>

      <ng-template #volumeDropdown>
        <label
          tuiLabel
          class="volume">
          {{ 'CALL.VOLUME' | translate }}: {{ volume() }}%
          <input
            tuiSlider
            type="range"
            min="0"
            max="200"
            step="5"
            [ngModel]="volume()"
            (ngModelChange)="onVolumeChange($event)" />
        </label>
      </ng-template>
    }
  </div>
</div>
