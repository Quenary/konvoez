<div
  class="peers-grid-root"
  [class.compact]="compact()">
  @if (!theatreFocusPeer()) {
    <div class="peers-layout">
      <section
        class="peers-section"
        [class]="peersSectionClass()">
        @for (peer of peers(); track peer.id) {
          <div class="grid-item">
            <app-voice-peer-tile
              [peer]="peer"
              [videoTrack]="videoTracksByPeerId()[peer.id] ?? null"
              [screenAvailable]="screenAvailableByPeerId()[peer.id] ?? false"
              [watchingScreen]="watchingByPeerId()[peer.id] ?? false"
              [showingScreen]="showingScreenByPeerId()[peer.id] ?? false"
              [screenLive]="screenLiveByPeerId()[peer.id] ?? false"
              (watchScreen)="onWatchScreen(peer.id)"
              (stopWatchScreen)="onStopWatchScreen(peer.id)"
              (openTheatre)="onOpenTheatre(peer.id)" />
          </div>
        }
      </section>
    </div>
  }

  @if (theatreFocusPeer(); as focusPeer) {
    <app-voice-theatre
      [focusPeer]="focusPeer"
      [videoTrack]="theatreVideoTrack()"
      [stripPeers]="peers()"
      [watchingByPeerId]="watchingByPeerId()"
      [screenLiveByPeerId]="screenLiveByPeerId()"
      (closeTheatre)="onCloseTheatre()"
      (focusPeerId)="onTheatreFocusPeer($event)"
      (stopWatch)="onTheatreStopWatch()" />
  }

  <app-screen-share-pip />

  @if (showControls()) {
    <footer class="controls-dock">
      <app-voice-controls-bar (hangup)="onHangup()" />
    </footer>
  }
</div>
