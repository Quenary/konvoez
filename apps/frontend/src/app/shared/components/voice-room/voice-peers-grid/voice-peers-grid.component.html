<div
  class="peers-grid-root"
  [class.compact]="compact()">
  <main
    class="peers-grid"
    [class]="gridClass()">
    @for (peer of peers(); track peer.id) {
      <div class="grid-item">
        <app-voice-peer-tile
          [peer]="peer"
          [videoTrack]="videoTracksByPeerId().get(peer.id) ?? null"
          [screenAvailable]="screenAvailableByPeerId().get(peer.id) ?? false"
          [watchingScreen]="watchingByPeerId().get(peer.id) ?? false"
          [showingScreen]="showingScreenByPeerId().get(peer.id) ?? false"
          [screenLive]="screenLiveByPeerId().get(peer.id) ?? false"
          (watchScreen)="onWatchScreen(peer.id)"
          (stopWatchScreen)="onStopWatchScreen(peer.id)" />
      </div>
    }
  </main>

  <app-screen-share-pip />

  @if (showControls()) {
    <footer class="controls-dock">
      <app-voice-controls-bar (hangup)="onHangup()" />
    </footer>
  }
</div>
