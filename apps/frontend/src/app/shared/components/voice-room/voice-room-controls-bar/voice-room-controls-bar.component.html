<div class="controls-bar">
  <div tuiGroup>
    <button
      tuiIconButton
      [appearance]="micMuted() ? 'negative' : 'neutral'"
      size="m"
      [iconStart]="micMuted() ? icons['mic-off'] : icons.mic"
      type="button"
      [loading]="micCaptureLoading()"
      tuiHintAppearance="floating"
      [tuiHint]="micHintKey() | translate"
      (click)="toggleMicrophone()">
    </button>

    <button
      tuiIconButton
      [appearance]="speakerMuted() ? 'negative' : 'neutral'"
      size="m"
      [iconStart]="speakerMuted() ? icons['headphone-off'] : icons.headphones"
      type="button"
      tuiHintAppearance="floating"
      [tuiHint]="speakerHintKey() | translate"
      (click)="toggleSpeaker()">
    </button>
  </div>

  <div tuiGroup>
    <button
      tuiIconButton
      [appearance]="cameraOn() ? 'primary' : 'neutral'"
      size="m"
      [iconStart]="cameraOn() ? icons.video : icons['video-off']"
      type="button"
      [disabled]="cameraDisabled()"
      tuiHintAppearance="floating"
      [tuiHint]="cameraHintKey() | translate"
      (click)="toggleStream('cam')">
    </button>

    @if (screenSupported) {
      <button
        tuiIconButton
        [appearance]="screenOn() ? 'primary' : 'neutral'"
        size="m"
        [iconStart]="
          screenOn() ? icons['screen-share-off'] : icons['screen-share']
        "
        type="button"
        [disabled]="screenDisabled()"
        tuiHintAppearance="floating"
        [tuiHint]="screenHintKey() | translate"
        (click)="toggleStream('screen')">
      </button>
    }
  </div>

  @if (layered()) {
    <div tuiGroup>
      <app-voice-room-stream-quality />
    </div>
  }

  <button
    tuiIconButton
    appearance="negative"
    size="m"
    [iconStart]="icons['phone-off']"
    type="button"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.HANGUP' | translate"
    (click)="onHangupClick()">
  </button>
</div>
