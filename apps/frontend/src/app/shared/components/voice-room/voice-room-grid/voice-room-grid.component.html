<div
  class="peers-grid-root"
  [class.compact]="compact()">
  @if (!theatreFocus()) {
    <div class="peers-layout">
      <section
        class="peers-section"
        [class]="peersSectionClass()">
        @for (tile of tiles(); track tile.key) {
          <div class="grid-item">
            <app-voice-room-tile
              [peer]="tile.peer"
              [streamKind]="tile.streamKind"
              [videoTrack]="tile.videoTrack"
              [screenAvailable]="tile.screenAvailable"
              [watchingScreen]="tile.watchingScreen"
              (watchScreen)="onWatchScreen(tile.peerId)"
              (stopWatchScreen)="onStopWatchScreen(tile.peerId)"
              (openTheatre)="onOpenTheatre(tile.peerId, tile.streamKind)" />
          </div>
        }
      </section>
    </div>

    @if (overlayTemplate(); as overlay) {
      <div class="view-chrome">
        <ng-container *ngTemplateOutlet="overlay" />
      </div>
    }
  }

  @if (theatreFocus()) {
    <app-voice-room-theatre
      [focusTile]="theatreTile()"
      [stripTiles]="tiles()"
      [overlay]="overlayTemplate()"
      [showLocalChrome]="compact()"
      (watchScreen)="onWatchScreen($event)"
      (stopWatchScreen)="onStopWatchScreen($event)" />
  }

  @if (showControls()) {
    <footer class="controls-dock">
      @if (compact() && showRemoteScreenWatchControls()) {
        <app-voice-room-theatre-watch-controls />
      }
      <app-voice-room-controls-bar (hangup)="onHangup()" />
    </footer>
  }
</div>
