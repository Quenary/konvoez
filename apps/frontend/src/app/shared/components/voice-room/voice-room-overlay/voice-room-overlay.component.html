<header
  tuiHeader
  class="room-header">
  <h2 tuiTitle>
    <div
      tuiAvatar
      size="s"
      class="header-avatar">
      @if (avatarUrl()) {
        <img
          [alt]="roomName()"
          [ngSrc]="avatarUrl()!"
          fill
          priority />
      } @else {
        {{ roomName() | tuiInitials }}
      }
    </div>

    {{ roomName() }}
    <span tuiSubtitle>
      {{ 'CALL.PARTICIPANTS' | translate: { count: participantsCount() } }}
    </span>
  </h2>

  @if (showAccessories()) {
    <aside tuiAccessories>
      @if (canManageRooms() && room(); as manageRoom) {
        <button
          tuiIconButton
          appearance="flat"
          size="s"
          iconStart="@tui.ellipsis-vertical"
          type="button"
          tuiDropdownAuto
          [tuiDropdown]="roomContextMenu"
          tuiHintAppearance="floating"
          [tuiHint]="'GENERAL.MORE' | translate">
          {{ 'GENERAL.MORE' | translate }}
        </button>

        <ng-template
          #roomContextMenu
          let-close>
          <app-room-context-menu
            [roomName]="manageRoom.name"
            (edit)="editRoom(manageRoom); close()"
            (delete)="deleteRoom(manageRoom); close()" />
        </ng-template>
      }

      @if (theatreOpen()) {
        <app-voice-theatre-actions />
      }
    </aside>
  }
</header>

<footer class="controls-dock">
  @if (theatreOpen()) {
    <app-voice-theatre-watch-controls />
  }
  <app-voice-controls-bar (hangup)="onHangup()" />
</footer>
