<header
  tuiHeader
  class="room-header"
  [class.vignette]="isFullscreen()">
  <h2 tuiTitle>
    <div
      tuiAvatar
      size="s"
      class="header-avatar">
      @if (displayAvatarUrl()) {
        <img
          [alt]="displayTitle()"
          [ngSrc]="displayAvatarUrl()!"
          fill
          priority />
      } @else {
        {{ displayTitle() | tuiInitials }}
      }
    </div>

    {{ displayTitle() }}
    <span tuiSubtitle>
      {{ 'CALL.PARTICIPANTS' | translate: { count: participantsCount() } }}
    </span>
  </h2>

  <aside tuiAccessories>
    @if (headerActions(); as actions) {
      <ng-container *ngTemplateOutlet="actions" />
    }

    @if (canManageRooms() && room(); as manageRoom) {
      <button
        tuiIconButton
        appearance="flat"
        size="s"
        iconStart="@tui.ellipsis-vertical"
        type="button"
        tuiDropdownAuto
        [tuiDropdown]="roomContextMenu"
        [tuiDropdownSided]="true"
        tuiHintAppearance="floating"
        [tuiHint]="'GENERAL.MORE' | translate">
        {{ 'GENERAL.MORE' | translate }}
      </button>

      <ng-template
        #roomContextMenu
        let-close>
        <app-room-context-menu
          [roomName]="manageRoom.name"
          (edit)="editRoom(manageRoom); close()"
          (delete)="deleteRoom(manageRoom); close()" />
      </ng-template>
    }

    <button
      tuiIconButton
      appearance="flat"
      size="s"
      type="button"
      [iconStart]="layoutToggleIcon()"
      [disabled]="!canToggleLayout()"
      [attr.aria-label]="layoutToggleHintKey() | translate"
      tuiHintAppearance="floating"
      [tuiHint]="layoutToggleHintKey() | translate"
      (click)="onToggleLayout()">
    </button>

    <button
      tuiIconButton
      appearance="flat"
      size="s"
      type="button"
      [iconStart]="isFullscreen() ? '@tui.minimize' : '@tui.maximize'"
      [attr.aria-label]="
        (isFullscreen() ? 'CALL.EXIT_FULLSCREEN' : 'CALL.FULLSCREEN')
          | translate
      "
      tuiHintAppearance="floating"
      [tuiHint]="
        (isFullscreen() ? 'CALL.EXIT_FULLSCREEN' : 'CALL.FULLSCREEN')
          | translate
      "
      (click)="onToggleFullscreen()">
    </button>
  </aside>
</header>

<footer
  class="controls-dock"
  [class.vignette]="isFullscreen()">
  @if (showRemoteScreenWatchControls()) {
    <app-voice-room-theatre-watch-controls [userId]="watchUserId()" />
  }
  <app-voice-room-controls-bar (hangup)="onHangup()" />
</footer>
