<div tuiGroup>
  <button
    tuiIconButton
    appearance="accent"
    size="m"
    type="button"
    iconStart="@tui.screen-share-off"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.STOP_WATCH_SCREEN' | translate"
    (click)="onStopWatch()">
  </button>

  <button
    tuiIconButton
    appearance="neutral"
    size="m"
    type="button"
    tuiDropdownAuto
    tuiDropdownDirection="top"
    iconStart="@tui.volume-2"
    [tuiDropdown]="screenVolumeDropdown"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.SCREEN_VOLUME' | translate">
  </button>
</div>

<ng-template #screenVolumeDropdown>
  <app-volume-control
    [id]="'theatre-screen-volume-' + userId()"
    [value]="screenVolume()"
    [label]="'CALL.SCREEN_VOLUME' | translate"
    (valueChange)="onScreenVolumeChange($event)" />
</ng-template>
