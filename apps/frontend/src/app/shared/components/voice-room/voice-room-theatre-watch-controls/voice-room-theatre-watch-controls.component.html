<div tuiGroup>
  <button
    tuiIconButton
    appearance="accent"
    size="m"
    type="button"
    [iconStart]="icons['screen-share-off']"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.STOP_WATCH_SCREEN' | translate"
    (click)="onStopWatch()">
  </button>

  <button
    tuiIconButton
    appearance="neutral"
    size="m"
    type="button"
    tuiDropdownAuto
    tuiDropdownDirection="top"
    [iconStart]="icons['volume-2']"
    [tuiDropdown]="screenVolumeDropdown"
    tuiHintAppearance="floating"
    [tuiHint]="'CALL.SCREEN_VOLUME' | translate">
  </button>

  @if (layered()) {
    <button
      tuiIconButton
      appearance="neutral"
      size="m"
      type="button"
      tuiDropdownAuto
      tuiDropdownDirection="top"
      [iconStart]="icons['sliders-horizontal']"
      [tuiDropdown]="qualityMenu"
      tuiHintAppearance="floating"
      [tuiHint]="'CALL.VIEW_QUALITY' | translate">
    </button>
  }
</div>

<ng-template #qualityMenu>
  @let selected = quality();
  <tui-data-list>
    @for (item of modes; track item.mode) {
      <button
        tuiOption
        type="button"
        [iconStart]="selected === item.mode ? icons.check : ''"
        (click)="onQualitySelect(item.mode)">
        {{ item.labelKey | translate }}
      </button>
    }
  </tui-data-list>
</ng-template>

<ng-template #screenVolumeDropdown>
  <app-volume-control
    [id]="'theatre-screen-volume-' + userId()"
    [value]="screenVolume()"
    [label]="'CALL.SCREEN_VOLUME' | translate"
    (valueChange)="onScreenVolumeChange($event)" />
</ng-template>
