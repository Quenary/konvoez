<div
  class="theatre"
  [class.strip-right]="stripRight()"
  [class.strip-bottom]="!stripRight()"
  (pointermove)="revealOverlay()"
  (pointerdown)="revealOverlay()">
  <div
    #stageEl
    class="stage"
    [class.overlay-on]="overlayVisible()"
    (click)="onStageActivate()"
    tabindex="-1"
    (keypress)="onStageActivate()"
    (touchstart)="revealOverlay()">
    @if (videoTrack()) {
      <video
        #videoEl
        class="stage-video"
        autoplay
        playsinline
        muted
        (loadedmetadata)="onVideoMetadata($event)"></video>
    } @else {
      <div class="stage-empty">{{ 'CALL.THEATRE_NO_VIDEO' | translate }}</div>
    }

    @if (showLocalChrome()) {
      <div class="stage-overlay">
        <div class="overlay-top">
          <app-voice-theatre-actions [fullscreenTarget]="stageEl" />
        </div>
      </div>
    }
  </div>

  <aside class="strip">
    @for (tile of stripTiles(); track tile.key) {
      <button
        type="button"
        class="strip-tile-wrap"
        [class.active]="isStripTileActive(tile)"
        [disabled]="isStripTileDisabled(tile)"
        (click)="onStripTileClick(tile)">
        <app-voice-peer-tile-mini
          [peer]="tile.peer"
          [videoTrack]="tile.videoTrack" />
      </button>
    }
  </aside>
</div>
