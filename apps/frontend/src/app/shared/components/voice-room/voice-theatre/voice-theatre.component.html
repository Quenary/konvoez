@let focus = focusPeer();

<div
  class="theatre"
  [class.strip-right]="stripRight()"
  [class.strip-bottom]="!stripRight()"
  (pointermove)="revealOverlay()"
  (pointerdown)="revealOverlay()">
  <div
    #stageEl
    class="stage"
    [class.overlay-on]="overlayVisible()"
    (click)="onStageActivate()"
    tabindex="-1"
    (keypress)="onStageActivate()"
    (touchstart)="revealOverlay()">
    @if (videoTrack()) {
      <video
        #videoEl
        class="stage-video"
        autoplay
        playsinline
        muted
        (loadedmetadata)="onVideoMetadata($event)"></video>
    } @else {
      <div class="stage-empty">{{ 'CALL.THEATRE_NO_VIDEO' | translate }}</div>
    }

    @if (showLocalChrome()) {
      <div class="stage-overlay">
        <div class="overlay-top">
          <app-voice-theatre-actions [fullscreenTarget]="stageEl" />
        </div>
      </div>
    }
  </div>

  <aside class="strip">
    @for (peer of stripPeers(); track peer.id) {
      <button
        type="button"
        class="strip-tile"
        [class.active]="peer.id === focus.id"
        [class.watching]="watchingByPeerId()[peer.id] === true"
        [class.live]="screenLiveByPeerId()[peer.id] === true"
        [disabled]="
          peer.id !== focus.id && watchingByPeerId()[peer.id] !== true
        "
        (click)="onStripPeerClick(peer.id)">
        <span class="strip-name">{{ peer.username }}</span>
        @if (screenLiveByPeerId()[peer.id]) {
          <span class="strip-live">{{ 'CALL.LIVE' | translate }}</span>
        }
      </button>
    }
  </aside>
</div>
