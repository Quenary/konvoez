<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS / Discord Squircle Clip Mask (512x512, rx/ry 120px) -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="120" ry="120" />
    </clipPath>

    <!-- Inner ambient gradient for backdrop -->
    <radialGradient id="card-glow" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1F2333" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#12131A" />
    </radialGradient>
  </defs>

  <!-- Rounded indigo card backdrop (transparent exterior) -->
  <g clip-path="url(#squircle)">
    <!-- Base indigo background -->
    <rect width="512" height="512" fill="#12131A" />
    <rect width="512" height="512" fill="url(#card-glow)" />

    <!-- Konvoez logo ("The Wave K" in #6788ff) -->
    <!-- 1. Vertical host node with rounded corners -->
    <rect x="105" y="114" width="79.7" height="284.4" rx="37" fill="#6788ff" />

    <!-- 2. Sound chevron (WebRTC / Voice Wave) with diagonal background-colored gap -->
    <path fill="#6788ff" stroke="#6788ff" stroke-width="5.7" stroke-linejoin="round" d="
      M 216.2 253.2
      L 335.6 133.7
      A 37 37 0 0 1 388.3 186.3
      L 310.0 256.0
      L 388.3 325.7
      A 37 37 0 0 1 335.6 378.3
      L 216.2 258.8
      A 3.98 3.98 0 0 1 216.2 253.2
      Z
    " />
  </g>

  <!-- Subtle translucent container border bevel -->
  <rect x="1" y="1" width="510" height="510" rx="119" ry="119" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
</svg>
