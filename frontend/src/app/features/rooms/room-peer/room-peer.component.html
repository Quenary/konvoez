@if (peer(); as p) {
  @if (avatarSignedUrl.hasValue()) {
    <p-avatar
      [image]="avatarSignedUrl.value()"
      shape="circle"
      [class.talking]="audioLevel() > 0">
    </p-avatar>
  } @else {
    <p-avatar
      [label]="p.username[0]"
      shape="circle"
      [class.talking]="audioLevel() > 0">
    </p-avatar>
  }

  {{ p.username }}
}
