[package]
name = "konvoez-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "~3.16", default-features = false, features = ["napi4"] }
napi-derive = "~3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "~0.62"
windows = { version = "~0.62", features = [
  "Win32_Media_Audio",
  "Win32_System_Threading",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "~0.10"
libspa = "~0.10"
x11rb = { version = "~0.14", features = ["record"] }
